<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nitin Glaze — Thank you</title>
<meta name="description" content="Thank you for your likes and comments. Nitin Glaze will be back soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#1d1416;--rose:#D9788A;--paper:#F7F0EC;--line:rgba(29,20,22,.12)}
html,body{height:100%}
body{background:radial-gradient(ellipse at 70% 40%,#FBE9EC 0%,var(--paper) 55%,#F3EBE4 100%);color:var(--ink);font-family:Jost,system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
header{display:flex;justify-content:center;padding:34px 24px 0}
.logo{text-align:center;letter-spacing:.42em;font-family:"Cormorant Garamond",serif;font-size:26px;font-weight:500;padding-left:.42em}
.logo small{display:block;font-family:Jost,sans-serif;font-size:10px;letter-spacing:.5em;color:var(--rose);margin-top:4px}
main{flex:1;display:grid;grid-template-columns:1.05fr .95fr;align-items:center;gap:40px;max-width:1240px;width:100%;margin:0 auto;padding:30px 48px}
.eyebrow{font-size:12px;letter-spacing:.38em;text-transform:uppercase;color:var(--rose);margin-bottom:26px;display:flex;align-items:center;gap:14px}
.eyebrow::before{content:"";width:38px;height:1px;background:var(--rose)}
h1{font-family:"Cormorant Garamond",serif;font-weight:400;font-size:clamp(44px,6.2vw,92px);line-height:.98;letter-spacing:-.01em}
h1 em{color:var(--rose);font-style:italic}
p.lead{margin-top:28px;font-size:18px;font-weight:300;line-height:1.7;max-width:470px;color:#4a3b3e}
.soon{margin-top:44px;display:inline-flex;align-items:center;gap:14px;padding:14px 26px;border:1px solid var(--line);border-radius:999px;font-size:13px;letter-spacing:.22em;text-transform:uppercase;background:rgba(255,255,255,.55);backdrop-filter:blur(6px)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--rose);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.6);opacity:.45}}
.visual{position:relative;aspect-ratio:1/1;max-width:520px;width:100%;justify-self:center}
.visual .glow{position:absolute;inset:8%;border-radius:50%;background:radial-gradient(circle,rgba(240,98,138,.28),transparent 65%);filter:blur(30px);animation:breathe 6s ease-in-out infinite}
.visual img{position:relative;width:100%;height:100%;object-fit:cover;border-radius:44% 56% 52% 48% / 48% 44% 56% 52%;box-shadow:0 40px 90px rgba(150,70,85,.22);animation:float 7s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-14px) rotate(1deg)}}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.08);opacity:1}}
.drop{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 8%,#F58FAA 22%,#D81B5C 100%);box-shadow:0 8px 18px rgba(216,27,92,.25);animation:float 6s ease-in-out infinite}
.d1{width:26px;height:26px;top:6%;left:4%;animation-delay:-1s}.d2{width:16px;height:16px;top:78%;left:-2%;animation-delay:-3s}.d3{width:20px;height:20px;top:12%;right:2%;animation-delay:-2s}.d4{width:12px;height:12px;bottom:4%;right:12%;animation-delay:-4s}
.reveal{opacity:0;transform:translateY(18px);animation:in 1s cubic-bezier(.2,.7,.2,1) forwards}
.r2{animation-delay:.15s}.r3{animation-delay:.3s}.r4{animation-delay:.45s}.r5{animation-delay:.25s}
@keyframes in{to{opacity:1;transform:none}}
footer{text-align:center;padding:26px 20px 34px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#7a6a6d}
footer b{font-weight:500;color:var(--ink)}
@media (max-width:860px){main{grid-template-columns:1fr;text-align:center;padding:24px 24px 10px;gap:28px}.visual{max-width:320px;order:-1}.eyebrow{justify-content:center}.eyebrow::before{display:none}p.lead{margin-left:auto;margin-right:auto;font-size:16px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.reveal{opacity:1;transform:none}}
</style>
</head>
<body>
<header class="reveal"><div class="logo">NITIN GLAZE<small>NAIL LACQUER</small></div></header>
<main>
  <section>
    <div class="eyebrow reveal">A little note</div>
    <h1 class="reveal r2">Thank you for your <em>likes</em> &amp; <em>comments.</em></h1>
    <div class="soon reveal r4"><span class="dot"></span>Coming back soon</div>
  </section>
  <div class="visual reveal r5">
    <div class="glow"></div>
    <img src="b29.jpg" alt="Nitin Glaze nail lacquer bottle in Petal Hush">
    <span class="drop d1"></span><span class="drop d2"></span><span class="drop d3"></span><span class="drop d4"></span>
  </div>
</main>
<footer>Designed &amp; built by <b>Nitin Chandra</b></footer>
</body>
</html>
